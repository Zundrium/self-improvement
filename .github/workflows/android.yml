name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-mobile:
    name: Web and mobile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run mobile:check
      - run: npm run mobile:build

  android:
    name: Android test, lint, and package
    needs: web-mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run mobile:build
      - run: npx cap sync android
      - name: Run Android tests and lint
        working-directory: android
        run: ./gradlew test lint :app:processReleaseMainManifest
      - name: Check merged release manifest permissions
        working-directory: android
        run: |
          manifest_path="$(find app/build/intermediates \
            \( -path '*/merged_manifest/release/*/AndroidManifest.xml' -o -path '*/merged_manifests/release/*/AndroidManifest.xml' \) \
            -print -quit)"
          test -n "$manifest_path" || { echo '::error::Merged release manifest was not found'; exit 1; }
          python3 - "$manifest_path" <<'PY'
          import sys
          import xml.etree.ElementTree as ElementTree

          android_namespace = 'http://schemas.android.com/apk/res/android'
          allowed_health_reads = {
              'android.permission.health.READ_SLEEP',
              'android.permission.health.READ_STEPS',
          }
          required_permissions = allowed_health_reads | {
              'android.permission.INTERNET',
              'android.permission.PACKAGE_USAGE_STATS',
          }
          root = ElementTree.parse(sys.argv[1]).getroot()
          permissions = {
              element.get(f'{{{android_namespace}}}name')
              for element in root.iter()
              if element.tag.rsplit('}', 1)[-1].startswith('uses-permission')
          }
          forbidden_permissions = sorted(
              permission
              for permission in permissions
              if permission == 'android.permission.QUERY_ALL_PACKAGES'
              or permission.startswith('android.permission.health.WRITE_')
              or (
                  permission.startswith('android.permission.health.READ_')
                  and permission not in allowed_health_reads
              )
          )
          missing_permissions = sorted(required_permissions - permissions)
          for permission in forbidden_permissions:
              print(f'::error::Forbidden merged manifest permission: {permission}')
          for permission in missing_permissions:
              print(f'::error::Missing merged manifest permission: {permission}')
          if forbidden_permissions or missing_permissions:
              raise SystemExit(1)
          PY
      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch'
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: self-improvement-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build signed release APK and AAB
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/self-improvement-release.keystore
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERT_SHA256; do
            test -n "${!variable}" || { echo "::error::$variable is not configured"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          export ANDROID_VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon assembleRelease bundleRelease
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          certificate_output="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)"
          normalize_sha256() {
            tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:'
          }
          actual_cert_sha256="$(printf '%s\n' "$certificate_output" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' | normalize_sha256)"
          expected_cert_sha256="$(printf '%s' "$ANDROID_CERT_SHA256" | normalize_sha256)"
          [[ "$actual_cert_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::Could not read one APK signing certificate SHA-256 digest'; exit 1; }
          [[ "$expected_cert_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::ANDROID_CERT_SHA256 must be a SHA-256 certificate fingerprint'; exit 1; }
          test "$actual_cert_sha256" = "$expected_cert_sha256" || { echo '::error::APK signing certificate does not match ANDROID_CERT_SHA256'; exit 1; }
          bundle_path='app/build/outputs/bundle/release/app-release.aab'
          jarsigner -verify "$bundle_path"
          bundle_certificate_output="$(keytool -printcert -jarfile "$bundle_path")"
          actual_bundle_sha256="$(printf '%s\n' "$bundle_certificate_output" | sed -n 's/^[[:space:]]*SHA256: //p' | normalize_sha256)"
          [[ "$actual_bundle_sha256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::Could not read the AAB signing certificate SHA-256 fingerprint'; exit 1; }
          test "$actual_bundle_sha256" = "$expected_cert_sha256" || { echo '::error::AAB signing certificate does not match ANDROID_CERT_SHA256'; exit 1; }
      - name: Upload signed release APK and AAB
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: self-improvement-${{ github.ref_name }}-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
