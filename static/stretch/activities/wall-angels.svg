<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
  <title id="title">Wall angels</title>
  <desc id="desc">A person standing with the back and ribs against a wall while the arms form a goalpost position.</desc>
