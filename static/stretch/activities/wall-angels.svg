    .line { fill: none; stroke: #52525b; stroke-linecap: round; stroke-linejoin: round; stroke-width: 10; }
    .soft { fill: #e4e4e7; stroke: #52525b; stroke-linecap: round; stroke-linejoin: round; stroke-width: 7; }
    .ground { fill: none; stroke: #a1a1aa; stroke-linecap: round; stroke-linejoin: round; stroke-width: 4; }
    .contact { fill: none; stroke: #a1a1aa; stroke-linecap: round; stroke-width: 4; }
    @media (prefers-color-scheme: dark) { .line { stroke: #e4e4e7; } .soft { fill: #3f3f46; stroke: #e4e4e7; } .ground { stroke: #71717a; } .contact { stroke: #a1a1aa; } }
  </style>
