<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
  <title id="title">Chest stretch</title>
  <desc id="desc">A person standing tall, holding a broom or pole across the shoulders with both hands and pressing it backward to open the chest.</desc>
  <style>
    .line { fill: none; stroke: #52525b; stroke-linecap: round; stroke-linejoin: round; stroke-width: 10; }
    .soft { fill: #e4e4e7; stroke: #52525b; stroke-linecap: round; stroke-linejoin: round; stroke-width: 7; }
    .ground { fill: none; stroke: #a1a1aa; stroke-linecap: round; stroke-linejoin: round; stroke-width: 4; }
    .pole { fill: none; stroke: #71717a; stroke-linecap: round; stroke-width: 8; }
    @media (prefers-color-scheme: dark) { .line { stroke: #e4e4e7; } .soft { fill: #3f3f46; stroke: #e4e4e7; } .ground { stroke: #71717a; } .pole { stroke: #a1a1aa; } }
  </style>
