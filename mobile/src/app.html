<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f5f2eb" />
		<link rel="icon" href="/app-icon.svg" />
		<style>
			#app-loading-screen {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #f5f2eb;
			}

			#app-loading-content {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1.75rem;
			}

			#app-loading-logo {
				width: 7rem;
				height: 7rem;
			}

			#app-loading-spinner {
				width: 1.75rem;
				height: 1.75rem;
				border: 3px solid rgb(109 40 217 / 18%);
				border-top-color: #6d28d9;
				border-right-color: #a21caf;
				border-radius: 9999px;
				animation: app-loading-spin 0.8s linear infinite;
			}

			@keyframes app-loading-spin {
				to {
					transform: rotate(360deg);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				#app-loading-spinner {
					animation-duration: 1.8s;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app-loading-screen" role="status" aria-label="Loading Self Improvement">
			<div id="app-loading-content">
				<img id="app-loading-logo" src="/app-icon.svg" alt="" />
				<span id="app-loading-spinner" aria-hidden="true"></span>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
