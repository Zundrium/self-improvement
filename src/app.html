<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="/app-icon.svg" />
		<script>
			const root = document.documentElement;
			let theme = 'system';
			try {
				theme = localStorage.getItem('self-improvement-theme') ?? 'system';
			} catch {}
			const dark =
				theme === 'dark' ||
				(theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
			root.classList.toggle('dark', dark);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app-loading-screen" role="status" aria-label="Loading Self Improvement">
			<div id="app-loading-content">
				<img id="app-loading-logo" src="/app-icon.svg" alt="" />
				<span id="app-loading-spinner" aria-hidden="true"></span>
			</div>
		</div>
		<div class="sveltekit-body">%sveltekit.body%</div>
	</body>
</html>
